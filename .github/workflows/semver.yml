name: SemVer

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  SemVerCheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check SemVer
      uses: obi1kenobi/cargo-semver-checks-action@v2
  PublishTest:
    if: ${{ contains( '#nopub', github.event.pull_request.body ) == false }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test publish
      run: cargo publish --dry-run --token ${{ secrets.CRATES_IO_TOKEN }}
  DontPublishTest:
    if: ${{ contains( '#nopub', github.event.pull_request.body ) == true }}
    runs-on: ubuntu-latest
    steps:
    - name: Skipped
      run: echo "Cargo publish --dry-run skipped"
