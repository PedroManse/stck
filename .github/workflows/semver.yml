name: SemVer

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check SemVer
      uses: obi1kenobi/cargo-semver-checks-action@v2
  test_publish:
    if: contains( "no-publish", github.event.pull_request.labels ) == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check SemVer
      uses: obi1kenobi/cargo-semver-checks-action@v2
    - name: Test publish
      run: cargo publish --dry-run --token ${{ secrets.CRATES_IO_TOKEN }}
